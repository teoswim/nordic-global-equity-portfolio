name: Update Nordic prices

on:
  schedule:
    # 17:00 UTC, weekdays — after Oslo (16:20 CEST), Copenhagen (17:00 CEST) and
    # Stockholm (17:30 CEST) close in summer, and safely after close in winter
    # (CET) too. A day's lag is fine for this mock portfolio, so one run/day
    # covers it — see README.md for the reasoning.
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {} # allows manually triggering a refresh from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Nordic prices + history
        run: node scripts/update-prices.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: daily price refresh $(date -u +%Y-%m-%d)"
            git push
          fi
